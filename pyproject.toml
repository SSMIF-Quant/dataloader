[build-system]
requires = ["setuptools>=75.6.0", "wheel", "setuptools-git-versioning"]
build-backend = "setuptools.build_meta"

[project]
name = "dataloader"
version = "0.1.0"
description = "A thread-safe data loader for ClickHouse."
authors = [{name="Deen Radoncic", email="deenr214@gmail.com"}]
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.13.0"
dependencies = [
    "attrs~=25.3.0",
    "clickhouse_connect~=0.8.18",
    "clickhouse_driver~=0.2.9",
    "dotenv~=0.9.9",
    "numpy~=2.3.2",
    "pandas~=2.3.2"
]

[project.optional-dependencies]
dev = [
    "black~=25.1.0",
    "pylint~=3.3.8",
    "mypy~=1.17.1"
]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pylint]
max-line-length = 88

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["dataloader"]
